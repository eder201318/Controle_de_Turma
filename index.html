<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controlo da Portaria Escolar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        button, a { -webkit-tap-highlight-color: transparent; }
        svg { width: 100%; height: 100%; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        @keyframes pulse-border {
            0% { box-shadow: 0 0 0 0 rgba(74, 222, 128, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(74, 222, 128, 0); }
            100% { box-shadow: 0 0 0 0 rgba(74, 222, 128, 0); }
        }
        .pulse-verde { animation: pulse-border 2s infinite; }
    </style>
</head>
<body class="bg-slate-100 font-sans pb-8 text-slate-800">

    <div id="app-root"></div>

    <script>
        const icones = {
            users: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>`,
            clock: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>`,
            checkCircle: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>`,
            live: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="2"/><path d="M16.24 7.76a6 6 0 0 1 0 8.49m-8.48-.01a6 6 0 0 1 0-8.49m11.31-2.82a10 10 0 0 1 0 14.14m-14.14 0a10 10 0 0 1 0-14.14"/></svg>`,
            book: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></svg>`,
            checkAll: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 7 17l-5-5"/><path d="m22 10-7.5 7.5L13 16"/></svg>`,
            timer: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12"/><path d="M16 8 8 16"/></svg>`
        };

        // Base de dados com horários rigorosamente oficiais
        const turmasBase = [
            { id: 'S_Terezinha_1', nome: '6º ANO A', grade: { 
                segunda: { saida: '18:45', prof: 'ING. ARIANE' }, terca: { saida: '18:45', prof: 'ARTE MARINETE' }, quarta: { saida: '18:45', prof: 'MAT. RIBAMAR' }, quinta: { saida: '18:45', prof: 'MAT. RIBAMAR' }, sexta: { saida: '18:00', prof: 'PROJETO' } 
            }},
            { id: 'S_Terezinha_2', nome: '6º ANO B', grade: { 
                segunda: { saida: '18:45', prof: 'PROJETO' }, terca: { saida: '18:00', prof: 'E. REL. DECA' }, quarta: { saida: '18:45', prof: 'GEO. NEREIDA' }, quinta: { saida: '18:45', prof: 'PORT. DIONE' }, sexta: { saida: '18:45', prof: 'PORT. DIONE' } 
            }},
            { id: 'S_Terezinha_3', nome: '7º ANO A', grade: { 
                segunda: { saida: '18:45', prof: 'E. AM. ALEXANDRO' }, terca: { saida: '16:15', prof: 'ING. DIONE' }, quarta: { saida: '18:45', prof: 'PORT. DIONE' }, quinta: { saida: '18:45', prof: 'HIST. ANTONIO' }, sexta: { saida: '18:45', prof: 'CIEN.' } 
            }},
            { id: 'S_Terezinha_4', nome: '7º ANO B', grade: { 
                segunda: { saida: '18:45', prof: 'PORT. DIONE' }, terca: { saida: '18:45', prof: 'MAT. LEILA' }, quarta: { saida: '18:45', prof: 'CIEN.' }, quinta: { saida: '17:15', prof: 'HIST. ANTONIO' }, sexta: { saida: '18:00', prof: 'E. REL. CÁSSIA' } 
            }},
            { id: 'S_Terezinha_5', nome: '7º ANO C', grade: { 
                segunda: { saida: '18:00', prof: 'ARTE. ALACI' }, terca: { saida: '18:00', prof: 'MAT. DICO' }, quarta: { saida: '18:45', prof: 'ING. OÉDISSON' }, quinta: { saida: '18:45', prof: 'PORT. ARIANE' }, sexta: { saida: '18:00', prof: 'GEO. VALDECÍRIA' } 
            }},
            { id: 'S_Terezinha_6', nome: '8º ANO A', grade: { 
                segunda: { saida: '18:45', prof: 'GEO. CARLOS' }, terca: { saida: '18:00', prof: 'E. AM ALEXANDRO' }, quarta: { saida: '18:45', prof: 'MAT. LEILA' }, quinta: { saida: '18:00', prof: 'ING. OÉDISSON' }, sexta: { saida: '18:00', prof: 'HIST. ALEXANDRO' } 
            }},
            { id: 'S_Terezinha_7', nome: '8º ANO B', grade: { 
                segunda: { saida: '18:00', prof: 'ING. OÉDISSON' }, terca: { saida: '18:45', prof: 'PORT. ARIANE' }, quarta: { saida: '18:45', prof: 'PORT. ARIANE' }, quinta: { saida: '18:45', prof: 'MAT. LEILA' }, sexta: { saida: '17:15', prof: 'CIEN. HADRIANE' } 
            }},
            { id: 'S_Terezinha_8', nome: '9º ANO U', grade: { 
                segunda: { saida: '17:15', prof: 'GEO. CARLOS' }, terca: { saida: '18:45', prof: 'E. REL. ERIVANA' }, quarta: { saida: '18:00', prof: 'HIST. ALEXANDRO' }, quinta: { saida: '18:45', prof: 'E. AM. ALEXANDRO' }, sexta: { saida: '18:45', prof: 'PORT. ARIANE' } 
            }}
        ];

        const chaveDoDia = { 0: 'domingo', 1: 'segunda', 2: 'terca', 3: 'quarta', 4: 'quinta', 5: 'sexta', 6: 'sabado' };
        const diasDaSemana = [
            { valor: 1, nome: 'Seg' }, { valor: 2, nome: 'Ter' }, { valor: 3, nome: 'Qua' },
            { valor: 4, nome: 'Qui' }, { valor: 5, nome: 'Sex' }
        ];

        const statusInfo = {
            aguardar: { nome: 'Aguardar (Em Aula)', bannerClass: 'bg-amber-200 text-amber-900 border-amber-300', iconeSVG: icones.clock },
            entregar: { nome: 'ENTREGAR CARTEIRINHAS', bannerClass: 'bg-green-500 text-white border-green-600 shadow-md', iconeSVG: icones.checkCircle },
            liberada: { nome: 'Alunos Liberados', bannerClass: 'bg-slate-200 text-slate-500 border-slate-300', iconeSVG: icones.checkAll }
        };

        let diaSelecionado; 

        function obterDataBrasilia() {
            const dataLocal = new Date();
            const dataBrasiliaStr = dataLocal.toLocaleString("en-US", {timeZone: "America/Sao_Paulo"});
            return new Date(dataBrasiliaStr);
        }

        function calcularInicioUltimaAula(saidaStr) {
            if (!saidaStr || saidaStr === '00:00') return '00:00';
            const partes = saidaStr.split(':');
            let h = parseInt(partes[0]); let m = parseInt(partes[1]);
            m -= 45; if (m < 0) { m += 60; h -= 1; }
            return h.toString().padStart(2, '0') + ':' + m.toString().padStart(2, '0');
        }

        function calcularTempoParaInicio(inicioStr) {
            const agora = obterDataBrasilia();
            const partes = inicioStr.split(':');
            const dataInicio = new Date(agora);
            dataInicio.setHours(parseInt(partes[0]), parseInt(partes[1]), 0, 0);
            const diffMs = dataInicio - agora;
            if (diffMs <= 0) return null;
            const diffMinutos = Math.ceil(diffMs / 60000);
            if (diffMinutos > 60) {
                const horas = Math.floor(diffMinutos / 60); const minutos = diffMinutos % 60;
                return `Em ${horas}h ${minutos}m`;
            }
            return `Em ${diffMinutos} min`;
        }

        function determinarEstado(diaAvaliado, saidaStr) {
            const agora = obterDataBrasilia();
            const diaAtual = agora.getDay() === 0 ? 7 : agora.getDay(); 
            const diaAvaliadoNumerico = diaAvaliado === 0 ? 7 : diaAvaliado;
            
            if (diaAvaliadoNumerico < diaAtual) return 'liberada';
            if (diaAvaliadoNumerico > diaAtual) return 'aguardar';  
            
            const horaAtual = agora.getHours().toString().padStart(2, '0') + ':' + agora.getMinutes().toString().padStart(2, '0');
            const inicioUltimaAula = calcularInicioUltimaAula(saidaStr);
            const saidaComparacao = saidaStr === '00:00' ? '24:00' : saidaStr;
            
            if (horaAtual >= saidaComparacao) return 'liberada'; 
            if (horaAtual >= inicioUltimaAula && horaAtual < saidaComparacao) return 'entregar'; 
            return 'aguardar'; 
        }

        window.mudarDia = (d) => { diaSelecionado = d; renderizarApp(); };

        function renderizarApp() {
            const appRoot = document.getElementById('app-root');
            const agora = obterDataBrasilia();
            if (diaSelecionado === 0 || diaSelecionado === 6) diaSelecionado = 1; 
            const diaAtualTexto = chaveDoDia[diaSelecionado];

            const turmasNoTurno = turmasBase
                .map(t => ({ ...t, dados: t.grade[diaAtualTexto] }))
                .filter(t => t.dados) 
                .map(t => {
                    const novoEstado = determinarEstado(diaSelecionado, t.dados.saida);
                    return { ...t, estado: novoEstado };
                })
                .sort((a, b) => a.dados.saida.localeCompare(b.dados.saida));

            let html = `
                <header class="bg-blue-900 text-white pt-4 pb-2 px-4 sm:px-8 shadow-md sticky top-0 z-20">
                    <div class="max-w-7xl mx-auto flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                        <h1 class="text-2xl font-bold flex items-center gap-3"><span class="w-8 h-8 text-blue-300">${icones.users}</span> Portaria Escolar</h1>
                        <div class="flex flex-wrap items-center gap-2">
                            <div class="flex items-center gap-2 text-sm font-bold bg-blue-950/60 px-4 py-2 rounded-lg border border-blue-800 shadow-inner">
                                <span class="w-4 h-4 text-emerald-400">${icones.live}</span><span class="tracking-widest text-emerald-50">${agora.toLocaleTimeString('pt-BR', { hour12: false })}</span>
                            </div>
                        </div>
                    </div>

                    <div class="max-w-7xl mx-auto flex w-full gap-1 sm:gap-2 overflow-x-auto mt-4 pb-2 no-scrollbar">
                        ${diasDaSemana.map(d => `<button onclick="mudarDia(${d.valor})" class="flex-1 min-w-[55px] py-2 px-1 rounded-lg text-sm font-bold transition-colors shadow-sm ${diaSelecionado === d.valor ? 'bg-white text-blue-900' : 'bg-blue-800 text-blue-100 hover:bg-blue-700'}">${d.nome}</button>`).join('')}
                    </div>
                </header>
                <main class="p-4 sm:p-6 lg:p-8 max-w-7xl mx-auto">
            `;

            if (turmasNoTurno.length > 0) {
                html += `<div class="grid grid-cols-[repeat(auto-fill,minmax(280px,1fr))] gap-5">`;
                turmasNoTurno.forEach(turma => {
                    const info = statusInfo[turma.estado];
                    
                    // LÓGICA DE CORES E DESFOQUE AUTOMÁTICO
                    let cardClass = '';
                    if (turma.estado === 'entregar') {
                        // Verde Pulsante quando está na hora de entregar
                        cardClass = 'bg-white border-green-400 ring-2 ring-green-400 shadow-lg pulse-verde scale-[1.02] z-10 relative';
                    } else if (turma.estado === 'liberada') {
                        // Desfocado e cinza assim que a aula terminar
                        cardClass = 'bg-slate-100 border-slate-200 opacity-40 blur-[1.5px] grayscale pointer-events-none transition-all duration-1000';
                    } else { 
                        // Amarelo claro enquanto aguarda
                        cardClass = 'bg-amber-50/40 border-amber-200 shadow-sm';
                    }

                    const inicioAula = calcularInicioUltimaAula(turma.dados.saida);
                    let tempoFalta = null;
                    if (diaSelecionado === agora.getDay() && turma.estado === 'aguardar') tempoFalta = calcularTempoParaInicio(inicioAula);

                    html += `
                        <div class="rounded-2xl transition-all duration-500 p-6 flex flex-col gap-6 ${cardClass}">
                            <div class="flex justify-between items-start">
                                <div>
                                    <h3 class="text-3xl font-black text-slate-800 tracking-tight">${turma.nome}</h3>
                                    <div class="mt-2 inline-flex items-center gap-1.5 text-xs font-bold text-slate-600 bg-slate-100 px-2.5 py-1.5 rounded-lg border border-slate-200 shadow-sm uppercase">
                                        <span class="w-4 h-4 text-slate-500">${icones.book}</span>${turma.dados.prof}
                                    </div>
                                </div>
                                <div class="flex flex-col items-end gap-1">
                                    <div class="text-xs font-bold text-slate-500 uppercase tracking-wider">Última Aula:</div>
                                    <div class="text-sm font-bold text-slate-700 bg-slate-100 px-3 py-1.5 rounded-xl border border-slate-200 flex items-center gap-2 shadow-sm">
                                        <span class="w-4 h-4 text-blue-600">${icones.clock}</span> ${inicioAula} - ${turma.dados.saida}
                                    </div>
                                    ${tempoFalta ? `<div class="mt-1.5 text-xs font-bold text-amber-600 flex items-center gap-1"><span class="w-3 h-3">${icones.timer}</span> ${tempoFalta}</div>` : ''}
                                </div>
                            </div>
                            <div class="flex flex-col gap-2">
                                <div class="flex items-center justify-center gap-3 py-4 px-4 border-2 rounded-2xl shadow-sm ${info.bannerClass}">
                                    <span class="w-6 h-6">${info.iconeSVG}</span><span class="text-lg font-black tracking-widest">${info.nome}</span>
                                </div>
                            </div>
                        </div>`;
                });
                html += `</div>`;
            } else {
                html += `<div class="flex flex-col items-center justify-center py-24 text-center opacity-40"><h3 class="text-2xl font-black uppercase">Nenhuma turma</h3><p class="font-medium">O turno selecionado está vazio hoje.</p></div>`;
            }
            html += `</main>`;
            appRoot.innerHTML = html;
        }

        window.onload = () => {
            diaSelecionado = obterDataBrasilia().getDay();
            if(diaSelecionado === 0 || diaSelecionado === 6) diaSelecionado = 1; 
            renderizarApp();
            setInterval(() => { renderizarApp(); }, 30000); 
        };
    </script>
</body>
</html>
